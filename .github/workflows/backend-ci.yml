name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]

jobs:
  edge-api:
    name: Edge API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/edge-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test

  cloud-api:
    name: Cloud API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/cloud-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: npm run check

  pest-risk:
    name: Pest-Risk Engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml/pest-risk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v

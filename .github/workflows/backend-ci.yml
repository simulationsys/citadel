name: Backend CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  pest-risk:
    name: Pest-Risk Engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml/pest-risk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v

  edge-api:
    name: Edge API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/edge-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pest-risk & edge dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ../../ml/pest-risk
          pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v

  cloud-api:
    name: Cloud API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/cloud-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ../../ml/pest-risk
          pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v

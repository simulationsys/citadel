name: citadel_farmer_app
description: "Citadel — Offline-first smart farming assistant for Indian farms"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  provider: ^6.1.0
  image_picker: 1.0.4
  shared_preferences: ^2.3.0
  intl: ^0.20.3
  google_fonts: ^6.2.0
  objective_c: 8.0.0
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/citadel_logo_bg_remove.png
    - assets/humidity.png
    - assets/rainfall.png
    - assets/temp_scale.png
    - assets/water_droplet.png
    - assets/water_on_soil_for_irrigation.png
    - assets/images/logo.png
    - assets/images/onboarding_sensors.png
    - assets/images/onboarding_scan.png
    - assets/images/onboarding_irrigation.png
    - assets/images/onboarding_language.png
    - assets/images/farmer_avatar.png
    - assets/images/wheat_crop.jpg
